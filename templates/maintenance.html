
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b12">
    <title>صيانة النظام | VEXORA HOST</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #0b0b12;
            --surface: #151521;
            --purple: #a78bfa;
            --cyan: #22d3ee;
            --text: #f4f4f8;
            --muted: #a1a1b5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(
                    ellipse at 15% 15%,
                    rgba(124, 58, 237, 0.18),
                    transparent 45%
                ),
                radial-gradient(
                    ellipse at 85% 85%,
                    rgba(6, 182, 212, 0.12),
                    transparent 45%
                ),
                var(--background);
            color: var(--text);
            font-family: system-ui, sans-serif;
        }

        .maintenance-card {
            width: 100%;
            max-width: 580px;
            padding: clamp(26px, 6vw, 48px);
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 26px;
            background: rgba(21, 21, 33, 0.94);
            text-align: center;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        }

        .brand {
            margin-bottom: 30px;
            color: var(--text);
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .brand span {
            color: var(--cyan);
        }

        .icon {
            display: grid;
            width: 92px;
            height: 92px;
            place-items: center;
            margin: 0 auto 24px;
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 28px;
            background: rgba(34, 211, 238, 0.07);
            font-size: 42px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(24px, 5vw, 34px);
            line-height: 1.5;
        }

        .description {
            margin: 0 auto;
            max-width: 420px;
            color: var(--muted);
            font-size: 15px;
            line-height: 2;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-top: 26px;
            padding: 10px 16px;
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 999px;
            background: rgba(124, 58, 237, 0.09);
            color: var(--purple);
            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--purple);
            box-shadow: 0 0 12px var(--purple);
        }

        .footer {
            margin-top: 34px;
            color: #77778e;
            font-size: 12px;
            line-height: 1.8;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <main class="maintenance-card">
        <div class="brand">VEXORA <span>HOST</span></div>

        <div class="icon" aria-hidden="true">🛠️</div>

        <h1>بنجهّز تجربة أفضل ليك</h1>

        <p class="description">
            الموقع في وضع الصيانة حاليًا لإجراء تحديثات وتحسينات.
            هنحاول نرجّع الخدمة في أقرب وقت ممكن.
            شكرًا لصبرك.
        </p>

        <div class="status">
            <span class="status-dot" aria-hidden="true"></span>
            الموقع في وضع الصيانة
        </div>

        <p class="footer">
            VEXORA HOST<br>
            استضافة وإدارة مشاريع Python
        </p>
    </main>
</body>
</html>
