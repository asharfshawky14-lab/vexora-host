{% extends "base.html" %}

{% block title %}404 — Page Not Found | VEXORA HOST{% endblock %}
{% block page_name %}Page Not Found{% endblock %}

{% block content %}
<section class="panel" style="max-width: 760px; margin: 48px auto; text-align: center; padding: 48px 24px;">
    <div style="font-size: 72px; font-weight: 900; line-height: 1.2; color: #9865ff;">
        404
    </div>

    <div style="font-size: 42px; margin: 12px 0;">⌁</div>

    <h1>الصفحة مش موجودة</h1>

    <p class="muted" style="max-width: 480px; margin: 0 auto 24px;">
        الصفحة اللي بتحاول تفتحها مش موجودة أو اتنقلت.
        اتأكد من الرابط وجرّب تاني.
    </p>

    <div class="button-row" style="justify-content: center;">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            الرجوع للوحة التحكم
        </a>

        <button
            type="button"
            class="btn btn-secondary"
            onclick="history.back()"
        >
            الصفحة السابقة
        </button>
    </div>
</section>
{% endblock %}
